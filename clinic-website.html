<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>The Daily Aesthetics — Pixel Clone</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#fff; }
    .wrap { position:fixed; inset:0; }
    iframe { width:100%; height:100%; border:0; display:block; }
    .fallback { position:fixed; inset:0; display:none; align-items:center; justify-content:center; font-family:Arial,sans-serif; padding:24px; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <iframe id="tda" src="https://thedailyaesthetics.com/" referrerpolicy="no-referrer"></iframe>
  </div>
  <div id="fallback" class="fallback">
    Unable to embed directly due to host restrictions. Open <a href="https://thedailyaesthetics.com/" target="_blank" rel="noopener">The Daily Aesthetics</a>.
  </div>
  <script>
    const frame = document.getElementById('tda');
    const fallback = document.getElementById('fallback');
    setTimeout(() => {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc || !doc.body || doc.body.children.length === 0) fallback.style.display = 'flex';
      } catch (e) {
        // Cross-origin or X-Frame restrictions: keep iframe attempt, show fallback as assistive message.
      }
    }, 2500);
  </script>
</body>
</html>
